name: Build and Release JellyPremiere

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore JellyPremiere.sln

      - name: Build Release
        run: dotnet build JellyPremiere.sln -c Release --no-restore

      - name: Run Tests
        run: dotnet test JellyPremiere.sln -c Release --no-build

      - name: Build Zip and Manifest Artifacts
        run: ./build_release.sh

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "JellyPremiere ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.zip.md5
            dist/*.zip.sha256
            dist/manifest.json
